services:
  - type: web
    name: campusnext
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_OPPORTUNITIES_DATA_SOURCE_ID
        sync: false
      - key: NOTION_PARENT_PAGE_ID
        sync: false
      - key: NOTION_USERS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_TASKS_DATA_SOURCE_ID
        sync: false
      - key: NOTION_OUTCOMES_DATA_SOURCE_ID
        sync: false
